name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, fileinfo
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: composer validate --strict

      - name: Syntax check
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: vendor/bin/phpunit --exclude-group integration

      - run: vendor/bin/phpstan analyse --no-progress

      # Phase 5: enable once pint has been applied (Phases 0-4 are red by construction).
      # - if: matrix.php == '8.3'
      #   run: vendor/bin/pint --test
