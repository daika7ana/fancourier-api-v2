name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, fileinfo
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: composer validate --strict

      - name: Syntax check
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: vendor/bin/phpunit --exclude-group integration

      - run: vendor/bin/phpstan analyse --no-progress

      - name: Canary consumer (codemod)
        if: matrix.php == '8.3'
        run: |
          rm -rf build/canary
          cp -r canary/consumer-v1 build/canary
          vendor/bin/rector process build/canary
          vendor/bin/rector process build/canary --dry-run
          php build/canary/run.php

      - name: Pint
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test
